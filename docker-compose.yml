# DevFlow AI: database + app.
#
#   docker compose up -d --build     start everything   (or just run start.bat / ./start.sh)
#   docker compose down              stop (your data is kept)
#
# The database is NOT published on your computer's network: the app reaches it over Docker's
# private network, so it never conflicts with a PostgreSQL you already have on port 5432.
# To run the app from source with `./mvnw spring-boot:run`, publish the database on port 5433:
#   docker compose -f docker-compose.yml -f docker-compose.db-port.yml up -d postgres
#
# Credentials come from your `.env` file (start scripts create it; see .env.example).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devflow}
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - devflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: devflow-ai:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-devflow}
      DB_USERNAME: ${POSTGRES_USER:-devflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"

volumes:
  devflow-pgdata:
