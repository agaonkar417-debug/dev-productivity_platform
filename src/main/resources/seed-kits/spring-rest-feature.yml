      package {{basePackage}}.{{entity|camel|lower}};

      import org.junit.jupiter.api.Test;
      import org.springframework.web.server.ResponseStatusException;

      import java.util.Optional;

      import static org.assertj.core.api.Assertions.assertThat;
      import static org.assertj.core.api.Assertions.assertThatThrownBy;
      import static org.mockito.ArgumentMatchers.any;
      import static org.mockito.Mockito.mock;
      import static org.mockito.Mockito.when;

      class {{entity|pascal}}ServiceTest {

          private final {{entity|pascal}}Repository repository = mock({{entity|pascal}}Repository.class);
          private final {{entity|pascal}}Service service = new {{entity|pascal}}Service(repository);

          @Test
          void createSavesTheName() {
              when(repository.save(any())).thenAnswer(inv -> inv.getArgument(0));

              {{entity|pascal}} created = service.create(new {{entity|pascal}}Request("First {{entity|lower}}"));

              assertThat(created.getName()).isEqualTo("First {{entity|lower}}");
          }

          @Test
          void findByIdThrowsNotFoundForUnknownId() {
              when(repository.findById(42L)).thenReturn(Optional.empty());

              assertThatThrownBy(() -> service.findById(42L)).isInstanceOf(ResponseStatusException.class);
          }
      }
