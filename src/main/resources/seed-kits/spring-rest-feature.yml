      package {{basePackage}}.{{entity|camel|lower}};

      import org.springframework.http.HttpStatus;
      import org.springframework.stereotype.Service;
      import org.springframework.transaction.annotation.Transactional;
      import org.springframework.web.server.ResponseStatusException;

      import java.util.List;

      @Service
      public class {{entity|pascal}}Service {

          private final {{entity|pascal}}Repository repository;

          public {{entity|pascal}}Service({{entity|pascal}}Repository repository) {
              this.repository = repository;
          }

          @Transactional(readOnly = true)
          public List<{{entity|pascal}}> findAll() {
              return repository.findAll();
          }

          @Transactional(readOnly = true)
          public {{entity|pascal}} findById(long id) {
              return repository.findById(id)
                      .orElseThrow(() -> new ResponseStatusException(HttpStatus.NOT_FOUND, "{{entity|title}} " + id + " not found"));
          }

          @Transactional
          public {{entity|pascal}} create({{entity|pascal}}Request request) {
              return repository.save(new {{entity|pascal}}(request.name()));
          }

          @Transactional
          public {{entity|pascal}} update(long id, {{entity|pascal}}Request request) {
              {{entity|pascal}} {{entity|camel}} = findById(id);
              {{entity|camel}}.setName(request.name());
              return {{entity|camel}};
          }

          @Transactional
          public void delete(long id) {
              repository.delete(findById(id));
          }
      }
